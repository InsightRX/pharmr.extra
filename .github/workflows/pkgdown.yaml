# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          # Pinned to R 4.5 for P3M binary availability; see R-CMD-check.yaml.
          r-version: '4.5'
          use-public-rspm: true

      # See R-CMD-check.yaml: build qs2 with --without-TBB so its .so doesn't
      # fail to load against the runner's oneTBB (undefined symbol tbb::task).
      - name: Install qs2 without TBB (avoids oneTBB tbb::task load failure)
        run: |
          install.packages(c("Rcpp", "RcppParallel", "stringfish"))
          install.packages("qs2", type = "source",
                            configure.args = c(qs2 = "--without-TBB"))
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # cache-version bump: the previous cache held a truncated
          # RcppParallel/lib/libtbb.so ("file too short" on rxode2.so load).
          cache-version: 2
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
