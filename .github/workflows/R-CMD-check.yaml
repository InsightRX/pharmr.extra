# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:

    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    
    strategy:
      fail-fast: false
      matrix:
        config:
          # Pinned to R 4.5: P3M has binaries for the nlmixr2/rxode2 +
          # qs2/stringfish (RcppParallel) chain on 4.5, so nothing is compiled
          # from source. On 'release'/4.6 those binaries don't exist yet and
          # the chain builds from source, which both is slow and re-triggers
          # the stringfish TBB load failure (see the Makevars step below).
          - {os: ubuntu-latest,   r: '4.5'}
          #- {os: macos-latest,   r: 'release'}
          #- {os: windows-latest, r: 'release'}
          #- {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          
          
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install curl
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # Safety net for any RcppParallel-based package (stringfish/qs2/rxode2)
      # that still builds from source: force the TinyThread++ backend so the
      # compiled .so does not reference TBB. Without this, a source build links
      # RcppParallel's bundled legacy TBB and fails to load against the runner's
      # oneTBB (undefined symbol tbb::...::concurrent_vector_base_v3...). The
      # macro is a compile-time -D flag; the env var of the same name has no
      # effect. RcppParallel defaults RCPP_PARALLEL_USE_TBB to 1 on linux.
      - name: Disable TBB backend for RcppParallel builds
        run: |
          mkdir -p ~/.R
          echo 'CPPFLAGS += -DRCPP_PARALLEL_USE_TBB=0' >> ~/.R/Makevars
        shell: bash

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          pak-version: devel
          extra-packages: |
            any::rcmdcheck
            cran/lotri
            cran/rxode2
            cran/nlmixr2est
            cran/nlmixr2extra
            cran/nlmixr2plot
            pharmpy/pharmr@v2.0.0
            InsightRX/irxutils
            InsightRX/PKPDsim
          needs: check
      
      - name: Install pharmpy
        run: pharmr::install_pharmpy()
        shell: Rscript {0}
      
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          upload-snapshots: true
          error-on: '"error"'
          check-dir: '"check"'
